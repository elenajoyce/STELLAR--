[package]
name = "denylist-gate-sep41"
version = "0.1.0"
edition = "2021"
description = "Denylist-gate integration for SEP-41 anchor compliance."
license = "MIT"
repository = "https://github.com/stellarwarden-kit/stellarwarden"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
denylist-gate = { path = "../../contracts/denylist-gate" }
