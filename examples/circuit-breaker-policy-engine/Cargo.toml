[package]
name = "circuit-breaker-policy-engine"
version = "0.1.0"
edition = "2021"
description = "Wires circuit-breaker as a pre-check before policy-engine evaluation."
license = "MIT"
repository = "https://github.com/stellarwarden-kit/stellarwarden"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
circuit-breaker = { path = "../../contracts/circuit-breaker" }
denylist-gate = { path = "../../contracts/denylist-gate" }
jurisdiction-flag = { path = "../../contracts/jurisdiction-flag" }
