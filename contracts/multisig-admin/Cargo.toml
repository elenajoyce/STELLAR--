[package]
name = "multisig-admin"
version = "0.1.0"
edition = "2021"
description = "M-of-N multisig authorization, usable as the admin address of any stellarwarden primitive via Soroban's custom-account interface."
license = "MIT"
repository = "https://github.com/stellarwarden-kit/stellarwarden"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
