[package]
name = "policy-engine"
version = "0.1.0"
edition = "2021"
description = "Composes multiple compliance checks with configurable AND/OR logic into a single evaluate call."
license = "MIT"
repository = "https://github.com/stellarwarden-kit/stellarwarden"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
denylist-gate = { path = "../../contracts/denylist-gate" }
jurisdiction-flag = { path = "../../contracts/jurisdiction-flag" }
